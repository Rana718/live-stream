version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/queries"
    # sqlc reads the migration files directly (lexical order) so generated
    # Go always matches the live schema. The v1 baseline lives in
    # db/_archive_v1/ and is deliberately outside this path.
    schema: "migrations"
    gen:
      go:
        package: "db"
        out: "internal/database/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        # Schema v2 uses native Postgres enums throughout; sqlc generates a
        # string-backed Go type per enum. No pgtype.Text overrides — the
        # dead user_role/stream_status/recording_status overrides from v1
        # are gone (user_role never existed post-033; stream_status ->
        # session_status; recording_status kept as an enum).
        overrides: []
