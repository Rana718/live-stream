syntax = "proto3";

package live.tenants.v1;

// TenantService — public org lookup, the caller's tenant, branding, and
// self-serve onboarding (internal/tenants).
service TenantService {
  rpc LookupByOrgCode(LookupByOrgCodeRequest) returns (LookupByOrgCodeResponse);
  rpc GetMyTenant(GetMyTenantRequest) returns (GetMyTenantResponse);
  rpc UpdateBranding(UpdateBrandingRequest) returns (UpdateBrandingResponse);
  rpc SelfServeOnboard(SelfServeOnboardRequest) returns (SelfServeOnboardResponse);
}

message PublicTenant {
  string id = 1;
  string org_code = 2;
  string name = 3;
  string slug = 4;
  string logo_url = 5;
  string theme_json = 6;
  string status = 7;
}

message LookupByOrgCodeRequest { string org_code = 1; }
message LookupByOrgCodeResponse { PublicTenant tenant = 1; }

message GetMyTenantRequest {}
message GetMyTenantResponse { string tenant_json = 1; } // the service returns a free-form map

message UpdateBrandingRequest {
  string name = 1;
  string logo_url = 2;
  string theme_json = 3;
}
message UpdateBrandingResponse { string tenant_json = 1; }

message SelfServeOnboardRequest {
  string org_name = 1;
  string admin_name = 2;
  string admin_phone = 3;
  string admin_email = 4;
  string city = 5;
}
message SelfServeOnboardResponse {
  string tenant_id = 1;
  string org_code = 2;
  string slug = 3;
  string admin_id = 4;
}
