version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: live-platform/gen/proto
plugins:
  # Keep protocolbuffers/go pinned == google.golang.org/protobuf in go.mod.
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: ../gen/proto
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: ../gen/proto
    opt: paths=source_relative
