# Minimal Alertmanager config — routes everything to a single receiver.
# Replace the webhook_configs URL (or add slack_configs/email_configs)
# with your real on-call channel before relying on this in production;
# as shipped, alerts fire but have nowhere real to land.
route:
  receiver: default
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
    webhook_configs:
      # Point this at a real incident-management webhook (PagerDuty,
      # Opsgenie, a Slack incoming webhook, etc). Left as localhost so an
      # unconfigured deploy fails loudly (connection refused in
      # Alertmanager's own logs) instead of silently dropping alerts.
      - url: "http://localhost:9999/replace-with-a-real-webhook"
        send_resolved: true
